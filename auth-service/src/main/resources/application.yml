server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexusdrive}
    username: ${DB_USER:nexusdrive}
    password: ${DB_PASSWORD:nexusdrive}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    table: flyway_schema_history_auth
jwt:
  secret: ${JWT_SECRET:change-this-development-secret-32-bytes-minimum}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /swagger-ui.html
